name: Champion Chess Android (Google Play paketi)
on:
  push:
    branches: [champion-chess]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: AAB derle (imzasız; yükleme anahtarıyla ayrıca imzalanır)
        working-directory: android
        run: |
          chmod +x gradlew
          export VERSION_CODE=$(( ${{ github.run_number }} + 9 )) VERSION_NAME=2.0.0
          ./gradlew bundleRelease --no-daemon
      - name: Paketi builds dalına koy
        run: |
          OUT=champion-chess-2.0.0-$((${{ github.run_number }}+9))-unsigned.aab
          mkdir -p /tmp/b/android && cp android/app/build/outputs/bundle/release/app-release.aab /tmp/b/android/$OUT && cd /tmp/b
          git init -q -b champion-builds && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Android paketi $OUT"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" champion-builds
